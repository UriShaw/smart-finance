name: smart_finance
description: "Smart Finance - quản lý chi tiêu cá nhân offline-first, đồng bộ Supabase."
publish_to: "none"

# version: <semver>+<build number>
# scripts/build.ps1 tự tăng build number mỗi lần build (hoặc dùng -Bump patch/minor/major).
version: 1.0.0+16

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management (DEC-004)
  flutter_riverpod: ^2.6.1

  # Cloud backend (DEC-001)
  supabase_flutter: ^2.8.0

  # Local database - SQLite, không cần code generation (DEC-003)
  sqflite: ^2.4.1
  sqflite_common_ffi: ^2.3.4
  sqlite3_flutter_libs: ">=0.5.24 <0.7.0"

  # Tiện ích
  path: ^1.9.0
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
  uuid: ^4.5.1
  intl: any
  crypto: ^3.0.5
  connectivity_plus: ^6.1.0
  url_launcher: ^6.3.0

  # Ảnh hóa đơn
  image_picker: ^1.1.2
  image: ^4.2.0

  # Backup / export chọn file
  file_selector: ^1.0.3

  # Bản đồ (provider OSM qua abstraction MapService - DEC-009)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Khoảnh khắc: vị trí chụp ảnh
  geolocator: ">=13.0.2 <15.0.0"
  geocoding: ">=3.0.0 <5.0.0"
  google_maps_flutter: ^2.18.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
